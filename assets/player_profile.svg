<svg viewBox="0 0 880 330" width="880" height="330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Player profile: Yahia, Software Engineer">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="ledGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; font-size: 16px; }
    .key { fill: #00ff9f; font-weight: 700; }
    .str { fill: #a5d6ff; }
    .pun { fill: #6e7681; }
    .cmt { fill: #6e7681; font-style: italic; }
    .ttl { fill: #8b949e; font-size: 13px; letter-spacing: 2px; font-weight: 700; }

    .line { animation: type .5s steps(18) both; }
    @keyframes type { from { clip-path: inset(-15% 100% -15% 0); } to { clip-path: inset(-15% -2% -15% 0); } }
    .l1 { animation-delay: .3s; }  .l2 { animation-delay: .9s; }
    .l3 { animation-delay: 1.5s; } .l4 { animation-delay: 2.1s; }
    .l5 { animation-delay: 2.7s; } .l6 { animation-delay: 3.4s; }
    .l7 { animation-delay: 4.1s; } .l8 { animation-delay: 4.8s; }

    .caret { fill: #00ff9f; animation: blink 1.1s steps(1) 5.6s infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

    .led { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>

  <!-- terminal window -->
  <rect x="10" y="10" width="860" height="310" rx="14" fill="#0d1117" stroke="#21262d" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- title bar -->
  <rect x="10" y="10" width="860" height="40" rx="14" fill="#161b22"/>
  <rect x="10" y="36" width="860" height="14" fill="#161b22"/>
  <circle cx="38" cy="30" r="6.5" fill="#ff5f56"/>
  <circle cx="60" cy="30" r="6.5" fill="#ffbd2e"/>
  <circle cx="82" cy="30" r="6.5" fill="#27c93f"/>
  <text x="440" y="35" text-anchor="middle" class="mono ttl">PLAYER_PROFILE.exe</text>

  <!-- code -->
  <g class="mono">
    <text x="36" y="85"  class="line l1"><tspan class="key">player</tspan><tspan class="pun">:</tspan></text>
    <text x="36" y="113" class="line l2"><tspan class="pun">&#160;&#160;</tspan><tspan class="key">name</tspan><tspan class="pun">: </tspan><tspan class="str">"Yahia"</tspan></text>
    <text x="36" y="141" class="line l3"><tspan class="pun">&#160;&#160;</tspan><tspan class="key">class</tspan><tspan class="pun">: </tspan><tspan class="str">"Software Engineer"</tspan></text>
    <text x="36" y="169" class="line l4"><tspan class="pun">&#160;&#160;</tspan><tspan class="key">special_ability</tspan><tspan class="pun">: </tspan><tspan class="str">"Turns coffee into code"</tspan>  <tspan class="cmt">&#9749;</tspan></text>
    <text x="36" y="197" class="line l5"><tspan class="pun">&#160;&#160;</tspan><tspan class="key">current_quest</tspan><tspan class="pun">: </tspan><tspan class="str">"Building software that survives production"</tspan></text>
    <text x="36" y="225" class="line l6"><tspan class="pun">&#160;&#160;</tspan><tspan class="key">side_quest</tspan><tspan class="pun">: </tspan><tspan class="str">"Mastering AI/ML one model at a time"</tspan></text>
    <text x="36" y="253" class="line l7"><tspan class="pun">&#160;&#160;</tspan><tspan class="key">weakness</tspan><tspan class="pun">: </tspan><tspan class="str">"Cannot resist refactoring"</tspan></text>
    <text x="36" y="281" class="line l8"><tspan class="pun">&#160;&#160;</tspan><tspan class="key">status</tspan><tspan class="pun">: </tspan><tspan class="str">"ONLINE — accepting new quests"</tspan></text>
  </g>

  <!-- pulsing status LED next to the status line -->
  <circle cx="420" cy="276" r="5" class="led" fill="#00ff9f" filter="url(#ledGlow)"/>

  <!-- blinking cursor on final prompt line -->
  <text x="36" y="306" class="mono key">&#36;</text>
  <rect x="54" y="293" width="10" height="17" class="caret"/>
</svg>
