<svg viewBox="0 0 880 96" width="880" height="96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Game over? Never. Continue? Yes">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0a1f"/>
      <stop offset="100%" stop-color="#1d1145"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff9f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00ff9f" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="fframe"><rect width="880" height="96" rx="14"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; }
    .go { font-size: 17px; font-weight: 800; letter-spacing: 4px; fill: #9d8cff; }
    .yes { font-size: 17px; font-weight: 800; letter-spacing: 4px; fill: #00ff9f; animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 0%,60% { opacity: 1; } 61%,100% { opacity: 0.15; } }
    .gridMove { animation: slide 3.2s linear infinite; }
    @keyframes slide { from { transform: translateY(0); } to { transform: translateY(18px); } }
  </style>
  <g clip-path="url(#fframe)">
    <rect width="880" height="96" fill="url(#fbg)"/>
    <g class="gridMove" stroke="url(#gridFade)" stroke-width="1" opacity="0.7">
      <line x1="0" y1="58" x2="880" y2="58"/><line x1="0" y1="76" x2="880" y2="76"/>
      <line x1="0" y1="94" x2="880" y2="94"/><line x1="0" y1="112" x2="880" y2="112"/>
    </g>
    <text x="300" y="52" text-anchor="middle" class="mono go" filter="url(#glow)">GAME OVER? NEVER.</text>
    <text x="610" y="52" text-anchor="middle" class="mono go">CONTINUE?</text>
    <text x="718" y="52" text-anchor="start" class="mono yes" filter="url(#glow)">[YES] &#9664;</text>
    <rect x="1" y="1" width="878" height="94" rx="13" fill="none" stroke="#00ff9f" stroke-opacity="0.3" stroke-width="2"/>
  </g>
</svg>
