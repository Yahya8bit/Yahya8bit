    .glyph { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    .iname { font-size: 12px; fill: #8b949e; }
    .slot { animation: drop .45s ease-out both; }
    @keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
