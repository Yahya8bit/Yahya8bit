  <text x="22" y="32" class="mono lab">GITHUB //</text>
  <text x="118" y="32" class="mono sub" filter="url(#glow)">Yahya8bit</text>
  <path class="arrow" d="M 220 19 l 10 7 l -10 7 z"/>
