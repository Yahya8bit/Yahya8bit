  <g class="card" style="animation-delay:0.25s">
  <rect x="24" y="64" width="832" height="82" rx="10" fill="#11161f" stroke="#21262d" stroke-width="1"/>
  <rect x="24" y="64" width="4" height="82" rx="2" fill="#00ff9f"/>
  <rect x="30" y="72" width="100" height="24" rx="12" fill="#00ff9f" fill-opacity="0.12" stroke="#00ff9f" stroke-opacity="0.5" stroke-width="1.2"/><text x="80.0" y="89" text-anchor="middle" class="mono status" fill="#00ff9f">✓ CLEARED</text>
  <text x="148" y="89" class="mono qtitle">Ensi Guide Orientation</text><text x="148" y="112" class="mono qdesc">A website to help new students coming from prepa to learn about ENSI</text>
