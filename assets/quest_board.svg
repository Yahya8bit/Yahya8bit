  <text x="148" y="185" class="mono qtitle">G&amp;Y Sole</text><text x="148" y="208" class="mono qdesc">E-commerce webapp for sneakers</text>
  <rect x="560.0" y="178" width="60.8" height="22" rx="11" fill="#1b2230" stroke="#2a3450" stroke-width="1"/><text x="590.4" y="193" text-anchor="middle" class="mono chip">Python</text><rect x="628.8" y="178" width="68.6" height="22" rx="11" fill="#1b2230" stroke="#2a3450" stroke-width="1"/><text x="663.1" y="193" text-anchor="middle" class="mono chip">FastAPI</text>
  <text x="846" y="190" text-anchor="end" class="mono xp" fill="#00ff9f" filter="url(#glow)">+450 XP</text>
