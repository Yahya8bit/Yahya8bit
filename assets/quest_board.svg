  <text x="846" y="94" text-anchor="end" class="mono xp" fill="#00ff9f" filter="url(#glow)">+500 XP</text>
  <line x1="28" y1="147" x2="852" y2="147" stroke="#21262d" stroke-width="1"/>
</g><g class="card" style="animation-delay:0.43s">
