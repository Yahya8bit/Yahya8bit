<svg viewBox="0 0 880 360" width="880" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Completed quests / projects">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; }
    .ttl  { fill: #8b949e; font-size: 13px; letter-spacing: 2px; font-weight: 700; }
    .status { font-size: 11.5px; font-weight: 800; letter-spacing: 2px; }
    .qtitle { font-size: 15px; font-weight: 800; fill: #e6edf3; letter-spacing: 0.5px; }
    .qdesc  { font-size: 12px; fill: #6e7681; }
    .chip   { font-size: 11.5px; fill: #9fb1c9; }
    .xp     { font-size: 17px; font-weight: 800; letter-spacing: 1px; }
    .card   { animation: rise .5s ease-out both; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  </style>

  <!-- window chrome -->
  <rect x="10" y="10" width="860" height="340" rx="14" fill="#0d1117" stroke="#21262d" stroke-width="1.5" filter="url(#shadow)"/>
